name: Run prime calculator

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, list, next, factor]
        default: check
      n:
        description: "integer"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run
        run: |
          if [ "${{ inputs.mode }}" = "check" ]; then
            python prime_calculator.py --check "${{ inputs.n }}"
          elif [ "${{ inputs.mode }}" = "list" ]; then
            python prime_calculator.py --list "${{ inputs.n }}"
          elif [ "${{ inputs.mode }}" = "next" ]; then
            python prime_calculator.py --next "${{ inputs.n }}"
          elif [ "${{ inputs.mode }}" = "factor" ]; then
            python prime_calculator.py --factor "${{ inputs.n }}"
          else
            echo "Unknown mode"
            exit 1
          fi