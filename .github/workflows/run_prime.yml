name: Run prime calculator

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Number"
        required: true
        default: "97"
      mode:
        description: "check | list | next | factor"
        required: true
        default: "check"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      N: ${{ github.event.inputs.n }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run calculator
        shell: bash
        run: |
          echo "MODE=$MODE  N=$N"
          case "$MODE" in
            check)
              python prime_calculator.py --check "$N"
              ;;
            list)
              python prime_calculator.py --list "$N"
              ;;
            next)
              python prime_calculator.py --next "$N"
              ;;
            factor)
              python prime_calculator.py --factor "$N"
              ;;
            *)
              echo "Unknown mode: $MODE"
              exit 1
              ;;
          esac
